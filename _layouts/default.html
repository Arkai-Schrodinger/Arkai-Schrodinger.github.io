---
layout: null
---
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root { --ink:#0a2a66; --muted:#475569; --line:#dbe4f0; --brand:#0b5ed7; --paper:#f7faff; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink);
      font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { background:#fff; border-bottom:1px solid var(--line); }
    header a { display:block; max-width:760px; margin:0 auto; padding:18px 20px;
      color:var(--brand); font-weight:700; text-decoration:none; letter-spacing:-.01em; }
    main { max-width:760px; margin:0 auto; padding:32px 20px 56px; background:#fff;
      border-left:1px solid var(--line); border-right:1px solid var(--line); }
    h1 { font-size:1.9rem; line-height:1.2; margin:0 0 1rem; letter-spacing:-.02em; }
    h2 { font-size:1.2rem; margin:2rem 0 .6rem; }
    p, li { color:#1e293b; }
    strong { color:var(--ink); }
    a { color:var(--brand); }
    table { width:100%; border-collapse:collapse; margin:1rem 0; font-size:.95rem; }
    th, td { border:1px solid var(--line); padding:.55rem .65rem; text-align:left; vertical-align:top; }
    th { background:#eef4ff; }
    code { background:#eef2f7; padding:.1rem .3rem; border-radius:4px; font-size:.9em; }
    footer { max-width:760px; margin:0 auto; padding:18px 20px 40px; color:var(--muted); font-size:.9rem; }
    @media (max-width:800px) { main { border-left:0; border-right:0; } }
  </style>
</head>
<body>
  <header><a href="/">Satset CPNS</a></header>
  <main>{{ content }}</main>
  <footer>Satset CPNS bukan aplikasi resmi pemerintah dan tidak berafiliasi dengan BKN/KemenPANRB.</footer>
</body>
</html>
